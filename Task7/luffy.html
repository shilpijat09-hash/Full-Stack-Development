<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="slider">

    <div class="card">
      <img src="luffy1.jpg">
    </div>

    <div class="card">
      <img src="luffy2.jpg">
    </div>

    <div class="card">
      <img src="luffy3.jpg">
    </div>

    <div class="card">
      <img src="luffy4.jpg">
    </div>

    <div class="card">
      <img src="luffy5.jpg">
    </div>

  </div>

  <div class="content">
    <button id="prev">⬆</button>
    <button id="next">⬇</button>

    <h1 class="title">Luffy Kun</h1>
    <p>MARKETING MANAGER</p>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot activeDot"></span>
    </div>
  </div>

</div>

</body>
</html>
